[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finmodel-audit"
version = "0.2.0"
description = "Учебный агент для проверяемого анализа финансовых моделей Excel"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]
supplemental = ["spreadsheet-auditor==0.4.0", "defusedxml==0.7.1"]

[project.scripts]
finmodel-audit = "finmodel_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
